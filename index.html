<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITRequest — Connexion</title>

    <!-- Fichier Bootstrap CSS principal -->
    <link rel="stylesheet" href="bootstrap.min.css">
    
    <!-- Fichier des icônes locales que vous venez de télécharger -->
    <link rel="stylesheet" href="bootstrap-icons.css">
    
    <!-- Votre nouveau fichier de style propre -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid">
        <div class="row g-0 vh-100">

            <!-- COLONNE GAUCHE -->
            <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-between text-white p-5" style="background: linear-gradient(rgba(10, 37, 64, 0.85), rgba(10, 37, 64, 0.85)), url('https://unsplash.com'); background-size: cover; background-position: center;">
                <div></div>
                <div class="ps-4">
                    <h1 class="fw-bold display-6 mb-3">Des solutions informatiques pour vos projets</h1>
                    <p class="mb-5 fs-5 text-white-50">Demandez, Comparez, Équipez.</p>
                    <ul class="list-unstyled fs-5">
                        <li class="mb-4 d-flex align-items-center gap-3"><i class="bi bi-laptop fs-4"></i> Ordinateurs</li>
                        <li class="mb-4 d-flex align-items-center gap-3"><i class="bi bi-display fs-4"></i> Écrans</li>
                        <li class="mb-4 d-flex align-items-center gap-3"><i class="bi bi-printer fs-4"></i> Imprimantes</li>
                        <li class="mb-4 d-flex align-items-center gap-3"><i class="bi bi-router fs-4"></i> Réseaux</li>
                        <li class="mb-4 d-flex align-items-center gap-3"><i class="bi bi-hdd-stack fs-4"></i> Stockage</li>
                    </ul>
                </div>
                <p class="small text-white-50 ps-4 mb-0">Votre partenaire en équipements IT</p>
            </div>

            <!-- COLONNE DROITE -->
            <div class="col-lg-6 d-flex flex-column justify-content-between bg-white p-4">
                <div class="my-auto mx-auto w-100" style="max-width: 400px;">
                    <div class="d-flex align-items-center gap-2 mb-4">
                        <i class="bi bi-buildings-fill fs-3 text-primary"></i>
                        <span class="fw-bold fs-3 text-dark">ITRequest</span>
                    </div>
                    <h2 class="fw-bold mb-1 text-dark">Connexion</h2>
                    <p class="text-muted mb-4">Accédez à votre espace</p>

                    <form>
                        
                        <button type="submit" onclick="window.location.href='dashboard.html'; return false;" class="btn btn-primary w-100 py-2 mb-3">Se connecter</button>
                       
                        <div class="input-group mb-3">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                            <input type="email" class="form-control bg-light" placeholder="Adresse courriel" required>
                        </div>
                      
                       <!--mot de passe avec œil barré par défaut -->
                        <div class="input-group mb-3">
                            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-light border-end-0" placeholder="Mot de passe" id="champMotDePasse" required>
                            <span class="input-group-text bg-light text-muted border-start-0" role="button" onclick="basculerAffichageMotDePasse()">
                                <i class="bi bi-eye-slash" id="iconeOeil"></i>
                            </span>
                        </div>


                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="checkSouvenir">
                                <label class="form-check-label small text-muted" for="checkSouvenir">Se souvenir de moi</label>
                            </div>
                            <a href="#" class="small text-decoration-none">Mot de passe oublié ?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Se connecter</button>
                        <div class="position-relative text-center my-4">
                            <hr class="text-muted">
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 text-muted small">ou</span>
                        </div>
                        <button type="button" class="btn btn-outline-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2 mb-4">
                            Continuer avec Google
                        </button>
                    </form>
                </div>
                <div class="d-flex justify-content-center gap-4 text-muted small text-uppercase pt-3 border-top w-100">
                    <span>Simple</span><span>•</span><span>Sécurisé</span><span>•</span><span>Efficace</span>
                        </div>
                    </div>

                </div>
            </div>

            <!-- On cible le fichier JS qui est juste à côté -->
            <script>
            function basculerAffichageMotDePasse() {
                const champ = document.getElementById('champMotDePasse');
                const icone = document.getElementById('iconeOeil');
                
                if (champ.type === 'password') {
                    // Si le texte est caché, on l'affiche et on met l'œil ouvert
                    champ.type = 'text';
                    icone.className = 'bi bi-eye';
                } else {
                    // Si le texte est visible, on le cache et on remet l'œil barré
                    champ.type = 'password';
                    icone.className = 'bi bi-eye-slash';
                }
            }
</script>

</body>
</html>
